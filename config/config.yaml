# nr viral-origin check (Step 10): Diamond BLASTp of final RdRp candidates
# against nr, restricted to the Riboviria taxon via diamond's own
# --taxonlist filter. Sequences with no significant (e-value < threshold)
# hit within Riboviria are excluded. Placeholder paths -- fill in real
# DelftBlue locations.
#
# NOTE: NCBI stopped publishing plain nr.gz FASTA on the FTP site in April
# 2024 -- only the pre-formatted BLAST database is still served. nr_fasta /
# prot_accession2taxid below are regenerated locally from that BLAST db via
# blastdbcmd (rule generate_nr_fasta_and_taxid_map in
# 00_setup_RNA_database.smk), not downloaded directly.
diamond_nr:
  db_dir:      "database/diamond_nr"                       # placeholder -- set to actual nr db dir on DelftBlue; also where `update_blastdb.pl nr` fetches BLAST db volumes
  nr_fasta:    "database/diamond_nr/nr.fasta"               # regenerated from the BLAST db via `blastdbcmd -db nr -entry all`
  dmnd_db:     "database/diamond_nr/nr.dmnd"
  taxdump_url: "https://ftp.ncbi.nlm.nih.gov/pub/taxonomy/new_taxdump/new_taxdump.tar.gz"
  taxdump_dir: "database/diamond_nr/taxdump"                # needs nodes.dmp + names.dmp, fed to `diamond makedb --taxonnodes/--taxonnames`
  prot_accession2taxid: "database/diamond_nr/prot.accession2taxid.tsv"  # regenerated via `blastdbcmd -outfmt "%a %T"`, not downloaded
  db_marker:   "database/diamond_nr/.build.done"
  riboviria_taxid: 2559587   # NCBI taxid for realm Riboviria, passed to diamond blastp --taxonlist
  evalue: 0.001          # NCBI nr BLASTp e-value threshold used for viral-origin filtering
  threads: 16
  runtime: 2880          # minutes (48 hours) -- nr search is slow
  memory: 16000           # MB per CPU -- used by diamond blastp search rules (workflow 03) and build_diamond_nr_db
  partition: "memory"
  account: "research-ceg-wm"
  # generate_nr_fasta_and_taxid_map (blastdbcmd) is single-threaded and doesn't
  # benefit from extra CPUs, but needs its own generous per-CPU memory since
  # -entry all over the whole nr db (with its OID/ISAM structures) can exceed
  # the default diamond_nr.memory sizing at cpus_per_task=1. Bump this (and/or
  # switch partition to "memory") if the rule gets OOM-killed.
  blastdbcmd_memory: 16000   # MB per CPU (cpus_per_task=1); blastdbcmd -entry all over full nr needs ~64-128 GB
  blastdbcmd_partition: "memory"
  annotate_taxonomy_threads: 4
  annotate_taxonomy_memory: 16000  # MB per CPU; 4 CPUs = 64 GB total for streaming prot.accession2taxid.tsv
  annotate_taxonomy_runtime: 600   # minutes (10 hours)
  annotate_taxonomy_partition: "memory"


