# ============================================================
# 100_figure: network diagram variants
# kk_threshold: "" = same as ku threshold; "all" = all 4 kk files; "0.6"/"0.7"/"0.8"/"0.9" = specific
# hide_not_in_list: true/false — exclude unknown contigs with no RdRP evidence
# ============================================================
network_figure:
  run: false   # set false to skip plot_network entirely (no figures generated)

  # Taxonomic levels to generate figures for.
  # Must match subdirectory names under 3_spearman_analysis and 4_spearman_analysis_RdRp_annotated.
  levels:
    - subspecies
    #- species

  # Cumulative r thresholds. Each value generates one set of figures that includes
  # all edges with r_group >= this threshold (e.g. 0.8 includes r_group 0.8 and 0.9).
  thresholds:
    #- "0.6"
    - "0.7"
    - "0.8"
    - "0.9"

  # Figure variants. Each key becomes a subdirectory in the output folder.
  # kk_threshold:     "" = load known-known pairs at the same threshold as known-unknown;
  #                   "all" = load all 4 known-known threshold files regardless of ku threshold;
  #                   "0.6"/"0.7"/"0.8"/"0.9" = load known-known at exactly this threshold only.
  # hide_not_in_list: true  = remove unknown contigs with rdrp_category=not_in_list from the figure;
  #                   false = show all unknown contigs including those with no RdRP evidence.
  variants:
    standard_kk0.7:                  # unknown contigs with ku r>=threshold; kk edges from r0.7 file
      kk_threshold:      "0.7"
      hide_not_in_list:  false
      kk_only:           false
    rdrp_kk0.7:                      # same as standard, but hide unknown contigs with no RdRP evidence
      kk_threshold:      "0.7"
      hide_not_in_list:  true
      kk_only:           false
    kk_only_kk0.7:                   # only known-known pairs at r>=0.7, no unknown contigs at all
      kk_threshold:      "0.7"
      hide_not_in_list:  false
      kk_only:           true
    standard_kk0.8:                  # unknown contigs with ku r>=threshold; kk edges from r0.8 file
      kk_threshold:      "0.8"
      hide_not_in_list:  false
      kk_only:           false
    rdrp_kk0.8:                      # same as standard, but hide unknown contigs with no RdRP evidence
      kk_threshold:      "0.8"
      hide_not_in_list:  true
      kk_only:           false
    kk_only_kk0.8:                   # only known-known pairs at r>=0.8, no unknown contigs at all
      kk_threshold:      "0.8"
      hide_not_in_list:  false

