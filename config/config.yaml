  memory: 3968          # MB per CPU
  partition: "gpu" # use gpu-v100 or gpu-a100 for GPU runs; "compute-p1,compute-p2" for CPU
  account: "research-ceg-wm"
  gpu_id: 0             # -1 = CPU; 0 = first GPU on node
  gpu_devices: "0"      # passed to CUDA_VISIBLE_DEVICES; only used when gpu_id >= 0
  gpus: 1               # --gpus-per-task value; only used when gpu_id >= 0
  truncation_seq_length: 4096
  time_str: "20230201140320"
  step: 100000
  threshold: 0.5        # LucaProt run threshold (base CSV)
  filter_threshold: 0.9 # post-filter threshold applied without re-running LucaProt; set null to disable
  print_per_number: 10

alphafold3:
  # https://github.com/google-deepmind/alphafold3/blob/main/docs/installation.md
  repo_url:     "https://github.com/google-deepmind/alphafold3.git"
  # Pinned to match the .sif image below (cford38/alphafold3 = AF3 v3.0.0
  # code), NOT the latest release -- the repo clone here is only used for
  # fetch_databases.sh, and it must match the container's AF3 version to
  # avoid database-format/CLI mismatches between what's fetched and what the
  # v3.0.0 code inside the container expects.
  version:      "v3.0.0"
  install_dir:  "tools/alphafold3"
  sif:          "tools/alphafold3/alphafold3.sif"
  # DelftBlue has no Docker daemon, and apptainer build --fakeroot cannot
  # parse a raw Dockerfile (tried -- fails with "invalid header keyword
  # found"). So the .sif is pulled from a prebuilt community image instead,
  # pinned at AF3 v3.0.0. See workflow/00_alphafold3.smk for details/fallback.
  # https://github.com/colbyford/af3-on-hpc / https://hub.docker.com/r/cford38/alphafold3
  docker_image: "cford38/alphafold3"
  # Model parameters are documented as gated (see WEIGHTS_TERMS_OF_USE.md),
  # but this URL currently serves the file with no auth challenge (verified
  # 2026-09-01, HTTP 200, ~973 MiB). Downloaded automatically below; usage is
  # still subject to WEIGHTS_TERMS_OF_USE.md regardless of download access.
  weights_url:  "https://storage.googleapis.com/alphafold3/af3.bin.zst"
  model_dir:    "database/alphafold3/models"
  db_dir:       "database/alphafold3/public_databases"
  db_marker:    "database/alphafold3/public_databases/.download.done"
  threads: 8
  runtime: 720          # minutes (12 hours) -- genetic search + inference
  memory: 8000           # MB per CPU
  # DelftBlue's GPU partitions are named gpu-v100 / gpu-a100 (not a generic
  # "gpu"). AF3 requires Compute Capability >=8.0 -- gpu-v100 nodes (Tesla
  # V100S, CC 7.0) are too old and will fail; only gpu-a100 (Tesla A100 80GB,
  # CC 8.0) works.
  partition: "gpu-a100"
  account: "research-ceg-wm"
  gpu_id: 0
  gpu_devices: "0"
  gpus: 1
  # Sequences per batch job (data-pipeline and inference are both grouped
  # this way via --input_dir) -- fewer per batch means more, shorter SLURM
  # jobs; more per batch means fewer, longer ones.
  batch_size: 25
  # CPU-only genetic/template search (--run_data_pipeline, --norun_inference).
  # This is the slow, memory-heavy stage (jackhmmer against UniRef90/UniProt/
  # MGnify/BFD in parallel) but needs no GPU -- run on regular compute nodes,
  # freeing gpu-a100 allocation for the fast inference-only stage below.
  data_pipeline:
    threads: 3             # CPUs per data-pipeline batch job (jackhmmer/nhmmer/hmmsearch n_cpu)
    runtime: 7200          # minutes (5 days) -- can be slow for some queries
    memory: 3968            # MB per CPU
    partition: "compute-p1"
    account: "research-ceg-wm"

