# ============================================================
# 101b_RDRP_phylum_tree.smk
# ============================================================
rdrp_tree:
  # Toggles which protein-set pipeline(s) run in
  # workflow/101b_RDRP_phylum_tree.smk. Each mode aligns/builds a tree from a
  # different protein region, gating an independent `if` block in the same
  # file. Any combination may be enabled at once.
  full_length: true
  palm_core: true
  palm_extended: true
  # Number of RVMT reference sequences (in file order) taken from the
  # reciprocal outgroup Phylum's {Phylum}_ref.faa. Capped at 2 because
  # Duplornaviricota's RVMT reference set only has 2 sequences.
  n_outgroup: 2
  # trimAl column/sequence-overlap trimming flags (paper: -resoverlap 0.70
  # -seqoverlap 75).
  trimal_resoverlap: 0.70
  trimal_seqoverlap: 75
  # FastTree substitution model / rate-variation flags (paper: WAG model,
  # gamma-distributed site rates).
  fasttree_flags: "-wag -gamma"
