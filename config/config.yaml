# ============================================================
# 05_esvirtue_correlation_analysis.smk
# ============================================================
correlation:
  threads: 16
  runtime: 3000  # minutes
  memory: 3968   # MB per CPU
  partition: "compute-p1,compute-p2"
  account: "research-ceg-wm"
  min_samples: 5            # exclude virus present in fewer than N samples (0 = keep all)
  thresholds: "0.6,0.7,0.8,0.9"
  p_threshold: 0.1
  clr_pseudocount: null    # pseudocount before CLR; null = auto (min non-zero value / 2), or set a number e.g. 1.0
  pairs: "kk,uk"           # pair types to include: kk=known-known, uk=unknown-known, ku=known-unknown, uu=unknown-unknown
  chunk_size: 5000         # rows per chunk for uk/ku (lower = less RAM); 5000 safe for 64 GB with 400 known x 150K unknown
  chunk_size_all_vs_all: 100  # rows per chunk for all-vs-all; 100 recommended when pass rate is high (>10%)

fastspar:
  run: true
  threads: 16
  runtime: 3000         # minutes
  memory: 10000           # MB per CPU
  partition: "memory"
  account: "research-ceg-wm"
  iterations: 50         # rounds of SparC estimation
  exclude_iterations: 10 # times to exclude highly correlated pairs
  threshold: 0.1         # minimum r to exclude a pair during estimation
  bootstraps: 1000       # number of bootstrap replicates for p-values
  min_samples_others: 10  # OTUs present in fewer than N samples are collapsed into an 'others' row
  r_threshold: "0.6,0.7,0.8,0.9"   # r thresholds for r_group in output
  r_min: 0.6             # minimum r to keep in filtered output
  p_threshold: 0.05      # maximum p-value to keep in filtered output


