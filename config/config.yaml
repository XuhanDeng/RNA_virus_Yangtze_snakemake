# ============================================================
# EPA-ng phylogenetic placement (workflow 07)
# ============================================================
# Reference: Neri et al. 2022 RCR90 reference MSA + tree (Zenodo 10.5281/zenodo.6553771)
# The reference tree/MSA are FIXED — placement only, never re-optimized or rebuilt.
epa_ng:
  # RVMT Zenodo V4 RdRp reference alignment (Neri et al. 2022 RCR90 motif-core MSA,
  # 77,520 seqs x 874 columns) located on DelftBlue.
  ref_msa:   "database/RVMT/RVMT_Zenodo_V4/RVMT_Zenodo_V4/RdRPs/210822m.77510.09.rt.afa"
  ref_tree:  "database/RVMT/RVMT_Zenodo_V4/RVMT_Zenodo_V4/Trees/210822m.77510.09.rt.ft.r.tre"
  # RiboV1.6_Info.tsv from RVMT Zenodo — col3=RCR90 tip label, col16-20=taxonomy
  rvmt_info_tsv: "database/RVMT/RVMT_Zenodo_V4/RVMT_Zenodo_V4/Tables/RiboV1.6_Info.tsv"
  # Whether to also include ICTV reference candidates (workflow 03 ICTV pipeline,
  # same tier1a/1b/2 outputs) in the query batches alongside contig candidates.
  # true  = ICTV sequences placed on the tree too (useful as a taxonomic anchor)
  # false = only contig-derived candidates are placed
  include_ictv: False
  # Whether to also include ESvirtu reference candidates (workflow 04_03,
  # same tier1a/1b/2 outputs) in the query batches. Independent of include_ictv.
  include_esvirtu: True
  # RAxML-style model string passed to epa-ng --model (confirmed flag name)
  model: "WAG+G"

  small_job:
    threads:   4
    memory:    3968   # MB per CPU
    runtime:   1440    # minutes
    partition: "compute-p1,compute-p2"
    account:   "research-ceg-wm"

  hmmbuild:
    threads:   8
    memory:    3968   # MB per CPU
    runtime:   240    # minutes
    partition: "compute-p1,compute-p2"
    account:   "research-ceg-wm"

  hmmalign:
    threads:   8
    memory:    3968   # MB per CPU
    runtime:   240    # minutes
    partition: "compute-p1,compute-p2"
    account:   "research-ceg-wm"

  epang:
    threads:   16
    memory:    16000  # MB per CPU — memory partition; 32 x 16000 = 512 GB
    runtime:   4880   # minutes (48 hours) — adjust after first batch timing
    partition: "memory"
    account:   "research-ceg-wm"

  gappa:
    threads:   8
    memory:    3968   # MB per CPU
    runtime:   240    # minutes
    partition: "compute-p1,compute-p2"
    account:   "research-ceg-wm"

  # De-novo FastTree pipeline (contig + ESvirtu + RT outgroup).
  # Activated when include_fasttree: true (independent of EPA-ng placement).
  # The RT outgroup sequences are extracted from the reference MSA
  # (ref_msa above): any sequence whose ID does NOT start with "Rv4_"
  # is treated as a reverse-transcriptase outgroup (10 seqs in RCR90).
  include_epang: True
  include_epang_unfiltered: True   # set True to also run EPA-ng on unfiltered sequences
  gappa_afract_threshold: 0.66    # afract cutoff for confident taxonomy annotation
  include_fasttree: True
  include_fasttree_ictv: True   # separate tree with ICTV sequences added
  include_fasttree_full: True        # separate tree with all 4010+142 unfiltered proteins
  include_fasttree_full_ictv: True   # same as full but with ICTV sequences added
  fasttree:
    threads:   8
    memory:    16000  # MB per CPU — FastTree is RAM-intensive on >3k seqs
    runtime:   5600  # minutes (2 weeks) — needed when bootstrap > 0
    partition: "memory"
    account:   "research-ceg-wm"
    bootstrap: 1000   # 0 = no bootstrap (SH-like support only); >0 = replicates
  itol:
    # Filter for known-unknown pairs (esvirtu ↔ contig) only.
    # A pair is kept only if seed_nonzero_samples >= min_seed_nonzero
    # AND target_nonzero_samples >= min_target_nonzero.
    # Set to 0 to disable that filter.
    min_seed_nonzero:   20   # min nonzero samples for the known (esvirtu) seed
    min_target_nonzero: 20    # min nonzero samples for the unknown (contig) target


# ============================================================
# 08_ssDNA_identification.smk
# ============================================================
genomad_filter:
  exclude_topology: "Provirus"
  min_hallmarks: 1
  # ICTV phyla / families whose taxonomy strings indicate ssDNA viruses.
  # GeNomad virus_summary 'taxonomy' column is searched for these substrings.
  # Add new entries here to extend the filter without touching the script.
  ssDNA_taxonomy_keywords:

    # --- Realm: Monodnaviria ---
    # Kingdom: Shotokuvirae (eukaryotic ssDNA + derived dsDNA)
    - "Cressdnaviricota"       # circular CRESS-DNA: Geminiviridae, Circoviridae,
                               #   Nanoviridae, Genomoviridae, Smacoviridae, etc.
    - "Cossaviricota"          # Parvoviridae (linear ssDNA), Papillomaviridae,
                               #   Polyomaviridae (NOTE: these last two are dsDNA)
    - "Commensaviricota"       # Anelloviridae — NEW phylum ratified 2025
                               #   (replaces "Preplasmaviricota" which was WRONG)

    # Family-level catch for unclassified / legacy labels
    - "Anelloviridae"          # in case phylum label is absent in your data

    # Kingdom: Loebvirae (bacterial ssDNA — filamentous phage)
    - "Hofneiviricota"         # Inoviridae, Plectroviridae (M13, fd phage)

    # Kingdom: Sangervirae (bacterial ssDNA — icosahedral phage)
    - "Phixviricota"           # Microviridae (φX174)

    # Kingdom: Trapavirae (archaeal ssDNA)
    - "Calorviricota"          # new 2025, hyperthermophilic archaea
    - "Saleviricota"           # archaeal ssDNA



